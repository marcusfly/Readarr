# docker-compose.yml — Readarr local development / testing
# Usage:
#   docker compose up           # start in foreground
#   docker compose up -d        # start detached
#   docker compose down -v      # stop and remove volumes (destructive)
#
# Override any value with a .env file or inline environment variables.
# See SUPPORT.md for upgrade and rollback procedures.

services:
  readarr:
    platform: linux/amd64
    # Use a locally built image during development:
    #   docker build -t readarr:local .
    #   Then replace 'image:' below with 'image: readarr:local'
    #
    # For a published image use:
    #   image: ghcr.io/readarr/readarr:develop
    build:
      context: .
      dockerfile: Dockerfile
      args:
        READARRVERSION: "0.0.0.0"
        BUILD_SOURCEBRANCHNAME: develop
        TARGETARCH: amd64
    image: readarr:local

    container_name: readarr

    # Port mapping: HOST:CONTAINER
    ports:
      - "${READARR_PORT:-8787}:8787"
      - "${READARR_HTTP_PORT:-8788}:8788"

    environment:
      # Application data directory inside the container (matches the VOLUME)
      READARR__APP__DATADIR: /config
      # Plain HTTP listening port (kept for non-SSL compatibility)
      READARR__SERVER__PORT: "8788"
      # Enable HTTPS for the primary 8787 bind
      READARR__SERVER__SSLPORT: "8787"
      READARR__SERVER__ENABLESSL: "true"
      READARR__SERVER__SSLCERTPATH: /config/certs/localhost.pfx
      READARR__SERVER__SSLCERTPASSWORD: "readarr"
      # Optional: default startup root folders (set these to container-side paths)
      READARR__ROOTFOLDER__PATH: "/books"
      READARR__ROOTFOLDER__AUDIOBOOKPATH: "/audiobooks"
      # For local-only testing, start with auth enabled (for remote access hardening).
      READARR__AUTH__METHOD: "Forms"
      READARR__AUTH__REQUIRED: "DisabledForLocalAddresses"
      # Optional: PostgreSQL connection (leave empty to use the default SQLite)
      READARR__POSTGRES__HOST: ""
      READARR__POSTGRES__PORT: "5432"
      READARR__POSTGRES__USER: ""
      READARR__POSTGRES__PASSWORD: ""
      # Timezone
      TZ: "${TZ:-Etc/UTC}"
      # ASPNETCORE_URLS is intentionally omitted so Readarr applies its own URL config.
      ASPNETCORE_HTTP_PORTS: ""
      ASPNETCORE_HTTPS_PORTS: ""

    volumes:
      # Persistent config / database
      - ./.readarr-data:/config
      # Mount your ebook library here (read-write so Readarr can rename/move files)
      - "${BOOKS_DIR:-./books}:/books"
      # Mount your audiobook library separately so ebook managers like Calibre only own /books
      - "${AUDIOBOOKS_DIR:-./audiobooks}:/audiobooks"

    # Run as UID:GID 1000:1000 (the built-in 'readarr' account).
    # Change to match your host user if bind-mount permissions require it.
    # user: "${PUID:-1000}:${PGID:-1000}"

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "sh", "-c", "curl -sf https://localhost:8787/ping -k"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Optional: PostgreSQL (comment out if using default SQLite) ──────────────
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: readarr_postgres
  #   environment:
  #     POSTGRES_DB: readarr
  #     POSTGRES_USER: readarr
  #     POSTGRES_PASSWORD: readarr_secret
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U readarr"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

volumes:
  readarr_config:
    driver: local
